name: CI / Deploy to Railway

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── Environment ──────────────────────────────────────────────────────────────
env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"
  RAILWAY_ENVIRONMENT: "production"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. CI — type-check + lint + build (runs on every push and PR)
  # ───────────────────────────────────────────────────────────────────────────
  ci:
    name: Build & Type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check
        run: pnpm exec tsc -p tsconfig.build.json --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Validate migrations
        run: pnpm run migrate:validate

      - name: Build
        run: pnpm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # 2. E2E Tests — runs after build, blocks deployment if any suite fails
  #
  # Uses testcontainers (Docker-in-Docker via the ubuntu runner's Docker daemon).
  # Each suite gets a fresh PostgreSQL + Redis container managed by Jest's
  # globalSetup/globalTeardown.  No secrets are required — all Stellar/Soroban
  # calls are replaced by in-process mocks.
  # ───────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 15

    # testcontainers needs the Docker daemon — ubuntu-latest provides this
    # without any extra setup.
    services: {}

    env:
      # Dummy values — real connections come from testcontainers at runtime
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mentorminds_e2e"
      REDIS_URL: "redis://localhost:6379"
      NODE_ENV: "test"
      JWT_SECRET: "ci-e2e-jwt-secret-at-least-32-characters-long!!!"
      JWT_REFRESH_SECRET: "ci-e2e-refresh-secret-at-least-32-char!!!!"
      JWT_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "7d"
      ENCRYPTION_KEY: "ci-e2e-encryption-key-exactly-32b!!"
      FILE_SIGNING_SECRET: "ci-e2e-file-signing-secret-32b!!!"
      SECRETS_PROVIDER: "env"
      LOG_LEVEL: "silent"
      STELLAR_NETWORK: "testnet"
      STELLAR_HORIZON_URL: "https://horizon-testnet.stellar.org"
      CORS_ORIGIN: "*"
      APP_BASE_URL: "http://localhost:5001"
      APP_CLIENT_URL: "http://localhost:3000"
      FRONTEND_URL: "http://localhost:3000"
      MEETING_PROVIDER: "jitsi"
      AWS_S3_BUCKET: "ci-e2e-bucket"
      AWS_ACCESS_KEY_ID: "ci-key"
      AWS_SECRET_ACCESS_KEY: "ci-secret"
      AWS_REGION: "us-east-1"
      SENTRY_DSN: ""
      API_VERSION: "v1"
      # Pass CI flag to jest config (bail=1 on failure)
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pre-pull Docker images so testcontainers startup doesn't count against
      # the test timeout budget.
      - name: Pre-pull testcontainer images
        run: |
          docker pull postgres:15-alpine &
          docker pull redis:7-alpine &
          wait
        continue-on-error: true

      - name: Run E2E test suites
        run: pnpm exec jest --config jest.e2e.config.ts --forceExit
        timeout-minutes: 10

      - name: Upload E2E test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            coverage-e2e/
            tests/e2e/setup/.container-state.json
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Deploy API service to Railway (only on push to main, after E2E passes)
  # ───────────────────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API → Railway
    runs-on: ubuntu-latest
    # ⚠️  E2E must pass before we deploy — this blocks deployment on E2E failure
    needs: [ci, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API service
        run: railway up --service mentorminds-api --detach --project ${{ secrets.RAILWAY_PROJECT_ID }} --environment ${{ env.RAILWAY_ENVIRONMENT }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ───────────────────────────────────────────────────────────────────────────
  # 4. Deploy Worker service to Railway (runs after API deploy)
  # ───────────────────────────────────────────────────────────────────────────
  deploy-worker:
    name: Deploy Workers → Railway
    runs-on: ubuntu-latest
    needs: deploy-api
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Worker service
        run: railway up --service mentorminds-worker --detach --project ${{ secrets.RAILWAY_PROJECT_ID }} --environment ${{ env.RAILWAY_ENVIRONMENT }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
